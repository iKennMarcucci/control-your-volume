<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Test tone</title>
  </head>
  <body>
    <h1>Test tone</h1>
    <script>
      // A steady 440 Hz sine at 0.25 amplitude: easy to measure after the extension's gain.
      const params = new URLSearchParams(location.search);
      document.title = params.get('title') || 'Test tone';
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = Number(params.get('hz') || 440);
      gain.gain.value = 0.25;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      window.resumeAudio = () => ctx.resume();
    </script>
  </body>
</html>
