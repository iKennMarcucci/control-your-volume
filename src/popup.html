<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Control Your Volume!</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app" id="app" data-view="tabs">
      <header class="header">
        <div class="header-main" id="header-tabs">
          <span class="brand">
            <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="24" height="24" rx="6" fill="currentColor" />
              <path d="M5.5 9.5h2.6L11.8 6.4v11.2l-3.7-3.1H5.5z" fill="var(--background-100)" />
              <path d="M14.6 9.2a4 4 0 0 1 0 5.6M16.9 7a7.1 7.1 0 0 1 0 10" stroke="var(--background-100)" stroke-width="1.6" stroke-linecap="round" fill="none" />
            </svg>
            <span data-i18n="extName"></span>
          </span>
          <button class="icon-btn" id="open-settings" type="button" data-i18n-label="settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 1.5h2.8l.4 1.9 1.3.7 1.8-.7 1.4 2.4-1.4 1.3v1.6l1.4 1.3-1.4 2.4-1.8-.7-1.3.7-.4 1.9H6.6l-.4-1.9-1.3-.7-1.8.7L1.7 10l1.4-1.3V7.1L1.7 5.8l1.4-2.4 1.8.7 1.3-.7z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
        <div class="header-main" id="header-settings" hidden>
          <button class="icon-btn" id="close-settings" type="button" data-i18n-label="back">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <h1 class="header-title" data-i18n="settings"></h1>
          <span class="icon-btn-spacer"></span>
        </div>
      </header>

      <main class="view" id="view-tabs">
        <div class="search" id="search-wrap" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4" /><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search" data-i18n-label="search" />
        </div>

        <section class="section" id="current-section" aria-labelledby="current-title">
          <h2 class="section-title" id="current-title" data-i18n="thisTab"></h2>
          <ul class="list" id="current"></ul>
        </section>

        <section class="section" id="playing-section" aria-labelledby="playing-title">
          <h2 class="section-title" id="playing-title">
            <span data-i18n="playing"></span><span class="count" id="playing-count"></span>
          </h2>
          <ul class="list" id="playing"></ul>
          <p class="empty" id="playing-empty" data-i18n="emptyPlaying"></p>
        </section>

        <section class="section" id="others-section">
          <h2 class="section-title">
            <button class="section-toggle" id="others-toggle" type="button" aria-expanded="false" aria-controls="others">
              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
              <span data-i18n="otherTabs"></span><span class="count" id="others-count"></span>
            </button>
          </h2>
          <ul class="list" id="others" hidden></ul>
        </section>

        <p class="empty empty-search" id="no-results" hidden></p>
      </main>

      <main class="view" id="view-settings" hidden>
        <div class="setting">
          <div class="setting-text">
            <label class="setting-label" for="setting-boost" data-i18n="settingsBoost"></label>
            <p class="hint" id="setting-boost-hint" data-i18n="settingsBoostHint"></p>
          </div>
          <input class="switch" id="setting-boost" type="checkbox" role="switch" aria-checked="false" aria-describedby="setting-boost-hint" />
        </div>

        <div class="setting">
          <div class="setting-text">
            <label class="setting-label" for="setting-free" data-i18n="settingsFree"></label>
            <p class="hint" id="setting-free-hint" data-i18n="settingsFreeHint"></p>
          </div>
          <input class="switch" id="setting-free" type="checkbox" role="switch" aria-checked="false" aria-describedby="setting-free-hint" />
        </div>

        <div class="setting">
          <div class="setting-text">
            <label class="setting-label" for="setting-badge" data-i18n="settingsBadge"></label>
            <p class="hint" id="setting-badge-hint" data-i18n="settingsBadgeHint"></p>
          </div>
          <input class="switch" id="setting-badge" type="checkbox" role="switch" aria-checked="false" aria-describedby="setting-badge-hint" />
        </div>

        <div class="setting">
          <div class="setting-text">
            <span class="setting-label" id="theme-label" data-i18n="settingsTheme"></span>
          </div>
          <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
            <label><input type="radio" name="theme" value="system" /><span data-i18n="themeSystem"></span></label>
            <label><input type="radio" name="theme" value="light" /><span data-i18n="themeLight"></span></label>
            <label><input type="radio" name="theme" value="dark" /><span data-i18n="themeDark"></span></label>
          </div>
        </div>

        <div class="setting setting-column">
          <div class="setting-row">
            <div class="setting-text">
              <span class="setting-label" data-i18n="settingsShortcuts"></span>
              <p class="hint" data-i18n="settingsShortcutsHint"></p>
            </div>
            <button class="btn btn-secondary btn-small" id="customize-shortcuts" type="button" data-i18n="customize"></button>
          </div>
          <dl class="shortcuts" id="shortcuts"></dl>
        </div>

        <div class="setting setting-column">
          <span class="setting-label" data-i18n="howItWorks"></span>
          <p class="hint" data-i18n="howItWorksHint"></p>
        </div>

        <div class="setting setting-column">
          <button class="btn btn-secondary" id="reset-all" type="button" data-i18n="resetAll"></button>
          <p class="status" id="reset-status" role="status"></p>
        </div>

        <footer class="footer">
          <span id="version"></span>
          <a href="https://github.com/iKennMarcucci/control-your-volume" target="_blank" rel="noreferrer" data-i18n="sourceCode"></a>
        </footer>
      </main>
    </div>

    <template id="row-template">
      <li class="row">
        <div class="row-head">
          <span class="favicon" aria-hidden="true"><img alt="" width="16" height="16" /><span class="favicon-letter"></span></span>
          <div class="row-text">
            <button class="row-title" type="button"><span class="row-title-text"></span><svg class="go-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h6v6M12 4l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
            <span class="row-meta"><span class="host"></span><span class="tags"></span></span>
          </div>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="row-controls">
          <button class="mute-btn icon-btn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z" fill="currentColor" /><path class="wave" d="M10.4 5.6a3.4 3.4 0 0 1 0 4.8M12.3 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /><path class="cross" d="m10.5 6 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          </button>
          <div class="slider-wrap">
            <input class="slider" type="range" min="0" max="100" step="1" value="100" />
          </div>
          <label class="value">
            <input class="value-input" type="text" inputmode="numeric" maxlength="4" autocomplete="off" spellcheck="false" />
            <span aria-hidden="true">%</span>
          </label>
          <div class="row-notice" hidden>
            <p class="notice-text"></p>
            <button class="btn btn-secondary btn-small allow-btn" type="button" data-i18n="allowFree"></button>
          </div>
        </div>
        <p class="row-hint" hidden></p>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
